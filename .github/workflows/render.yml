name: Distributed render

on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode directory name
        required: true
        default: p0p32jtr
        type: string
      shards:
        description: Number of parallel frame shards
        required: true
        default: "8"
        type: string
      crf:
        description: H.264 constant rate factor
        required: true
        default: "18"
        type: string
      source_run_id:
        description: Optional previous run ID whose completed shards should be reused
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: render-${{ inputs.episode }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total_frames: ${{ steps.plan.outputs.total_frames }}
    steps:
      - name: Check out renderer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate public captions
        run: node scripts/verify-public-payload.mjs "episodes/${{ inputs.episode }}/captions.json"

      - name: Plan frame shards
        id: plan
        run: node scripts/plan-shards.mjs "episodes/${{ inputs.episode }}/captions.json" "${{ inputs.shards }}"

  render:
    needs: plan
    if: inputs.source_run_id == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out renderer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Select episode
        run: cp "episodes/${{ inputs.episode }}/captions.json" public/episode.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render silent frame range
        run: >-
          pnpm exec remotion render src/index.ts BBCBilingual
          "out/chunk-${{ matrix.id }}.mp4"
          --codec=h264
          --crf=${{ inputs.crf }}
          --frames=${{ matrix.start }}-${{ matrix.end }}
          --muted
          --concurrency=2
          --timeout=120000
          --bundle-cache=false

      - name: Upload shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chunk-${{ matrix.id }}
          path: out/chunk-${{ matrix.id }}.mp4
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  assemble:
    needs: [plan, render]
    if: always() && needs.plan.result == 'success' && (needs.render.result == 'success' || needs.render.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.episode }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out renderer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download all shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Concatenate video shards
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE/chunks" -name 'chunk-*.mp4' -print0 \
            | sort -z -V \
            | while IFS= read -r -d '' file; do printf "file '%s'\n" "$file"; done \
            > concat.txt
          test "$(wc -l < concat.txt)" -eq "${{ inputs.shards }}"
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i concat.txt \
            -map 0:v:0 -c:v copy video-only.mp4

          actual_frames="$(ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=nb_read_frames \
            -of default=nokey=1:noprint_wrappers=1 video-only.mp4)"
          test "$actual_frames" -eq "${{ needs.plan.outputs.total_frames }}"

      - name: Download and decrypt private audio
        env:
          AUDIO_KEY: ${{ secrets.AUDIO_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -n "$AUDIO_KEY"
          gh release download "audio-${{ inputs.episode }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ inputs.episode }}.full.mp3.enc"
          node scripts/audio-crypt.mjs decrypt \
            "${{ inputs.episode }}.full.mp3.enc" episode-audio.mp3

          expected_duration="$(node -e \
            "const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[1])); console.log(p.durationMs / 1000)" \
            "episodes/${{ inputs.episode }}/captions.json")"
          actual_duration="$(ffprobe -v error -show_entries format=duration \
            -of csv=p=0 episode-audio.mp3)"
          node -e \
            "const difference=Math.abs(Number(process.argv[1])-Number(process.argv[2])); if (difference > 0.25) { throw new Error('Audio duration mismatch: ' + difference + ' seconds'); }" \
            "$expected_duration" "$actual_duration"

          ffmpeg -hide_banner -loglevel error -y -i episode-audio.mp3 \
            -c:a aac -b:a 192k episode-audio.m4a

      - name: Mux final video
        shell: bash
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i video-only.mp4 -i episode-audio.m4a \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a copy \
            "${{ inputs.episode }}.mp4"
          final_frames="$(ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=nb_read_frames \
            -of default=nokey=1:noprint_wrappers=1 \
            "${{ inputs.episode }}.mp4")"
          test "$final_frames" -eq "${{ needs.plan.outputs.total_frames }}"
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 "${{ inputs.episode }}.mp4"

      - name: Remove intermediate artifacts
        env:
          ARTIFACT_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("chunk-")) | .id' \
            | while read -r artifact_id; do
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
              done

      - name: Upload final MP4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.episode }}-final
          path: ${{ inputs.episode }}.mp4
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Distributed render complete"
            echo
            echo "- Episode: \`${{ inputs.episode }}\`"
            echo "- Frames: \`${{ needs.plan.outputs.total_frames }}\`"
            echo "- Shards: \`${{ inputs.shards }}\`"
            echo "- Reused run: \`${{ inputs.source_run_id || 'none' }}\`"
            echo "- Artifact retention: 1 day"
          } >> "$GITHUB_STEP_SUMMARY"
